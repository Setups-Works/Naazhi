<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Naazhi</title>
    <!-- Shown when the app can't be reached. Only system colours and fonts are used: this page is outside the app's theme. -->
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; font: 15px/1.5 system-ui, sans-serif; -webkit-app-region: drag; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 500; }
      p { margin: 0 0 20px; opacity: 0.7; }
      button { -webkit-app-region: no-drag; font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid GrayText; background: ButtonFace; color: ButtonText; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Naazhi needs a connection to open. Check your internet and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
