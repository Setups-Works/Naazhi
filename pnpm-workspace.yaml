packages:
  - apps/*
  - packages/*
allowBuilds:
  unrs-resolver: true
  # Firebase's postinstall scripts only prepare optional defaults; the app doesn't need them.
  '@firebase/util': false
  protobufjs: false
  # The desktop shell: Electron downloads its own binary, esbuild its native bundler. electron-winstaller is only for the Squirrel
  # installer, which we don't use (we ship NSIS).
  electron: true
  esbuild: true
  electron-winstaller: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - '@expo/ui@57.0.23'
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
